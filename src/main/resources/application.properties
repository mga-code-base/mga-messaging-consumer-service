# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-messaging-consumer-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8090
# =======================================================
# SECURITY CONFIGURATION
# =======================================================
jwt.secret=${JWT_SECRET:}
# =====================================================================
# AIVEN CLOUD KAFKA CONNECTION
# =====================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
# Consumer Group configuration
spring.kafka.consumer.group-id=mga-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
# =====================================================================
# DESERIALIZATION STRATEGY
# =====================================================================
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.mygym.app.models.BroadcastMessageDto
# Trust your application model packages to read JSON data safely
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mygym.app.models
# =====================================================================
# SSL FILE AUTHENTICATION (Use the same local files you generated)
# =====================================================================
spring.kafka.security.protocol=SSL
spring.kafka.ssl.trust-store-type=JKS
spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION:}
spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD:}
spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=${KAFKA_KEYSTORE_LOCATION:}
spring.kafka.ssl.key-store-password=${KAFKA_KEYSTORE_PASSWORD:}
# =======================================================
# REDIS NOTIFICATION FEED
# =======================================================
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
mga.notifications.retention=PT24H
mga.notifications.max-entries=10000
# =======================================================
# EUREKA / DISCOVERY Configuration
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
mga.notifications.dedupe-retention=PT24H

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability:4318/v1/traces}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
