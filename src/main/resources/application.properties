# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-messaging-consumer-service
server.port=8090
# =======================================================
# SECURITY CONFIGURATION
# =======================================================
jwt.secret=
# =====================================================================
# AIVEN CLOUD KAFKA CONNECTION
# =====================================================================
spring.kafka.bootstrap-servers=
# Consumer Group configuration
spring.kafka.consumer.group-id=
spring.kafka.consumer.auto-offset-reset=earliest
# =====================================================================
# DESERIALIZATION STRATEGY
# =====================================================================
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust your application model packages to read JSON data safely
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mygym.app.models
# =====================================================================
# SSL FILE AUTHENTICATION (Use the same local files you generated)
# =====================================================================
spring.kafka.security.protocol=SSL
spring.kafka.ssl.trust-store-type=JKS
spring.kafka.ssl.trust-store-location=
spring.kafka.ssl.trust-store-password=

spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=
spring.kafka.ssl.key-store-password=
# =======================================================
# REDIS NOTIFICATION FEED
# =======================================================
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
mga.notifications.retention=PT24H
mga.notifications.max-entries=10000
# =======================================================
# EUREKA / DISCOVERY Configuration
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always